[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "milionario"
version = "0.1.0"
description = "milionario"
requires-python = ">=3.8"
dependencies = [
    "pygame>=2.0.0",
]

[project.scripts]
milionario = "main.py"

[tool.setuptools.packages.find]
include = ["*"]