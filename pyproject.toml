[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "milionario"
version = "0.1.0"
description = "Gioco in stile Chi vuol essere milionario con Pygame"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pygame-ce>=2.0.0",
    "opencv-python",
    "pillow",
]